<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Campanula – Tintinnabuli Sequencer</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;1,300&family=Cinzel+Decorative&family=Alegreya:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--bg:#0c0d12;--panel:#12131a;--line:#22242f;--line2:#343746;--fg:#c8cad6;--mut:#6b6e80;--m:#8fa6e0;--t:#d99a64;color-scheme:dark;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100%;background:radial-gradient(1100px 520px at 50% -8%,#181b2b,var(--bg) 62%) no-repeat,var(--bg);color:var(--fg);font:400 15.5px/1.5 Alegreya,Georgia,serif}
main{max-width:960px;margin:0 auto;padding:22px 16px 48px}
header{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:16px}
h1{font:300 34px/1.1 "Cormorant Garamond",Georgia,serif;margin:0;letter-spacing:.16em}
h1 span{font-size:.5em;font-style:italic;letter-spacing:.04em;color:var(--mut);margin-left:.6em}
.by{margin:8px 0 0;font:400 16px/1.2 Alegreya,Georgia,serif;color:var(--t);letter-spacing:.14em;text-transform:uppercase}
.sub{color:var(--mut);font:400 14px/1.4 Alegreya,Georgia,serif;margin:10px 0 0;letter-spacing:.14em;text-transform:uppercase}
#go{width:56px;height:56px;border-radius:50%;border:1px solid var(--line2);background:var(--panel);color:var(--t);cursor:pointer;display:grid;place-items:center;flex:none;touch-action:manipulation}
#go:hover{border-color:var(--t)}
#go:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid var(--m);outline-offset:3px}
.roll{border:1px solid var(--line);border-radius:4px;background:#090a0e;overflow:hidden}
#cv{display:block;width:100%;height:250px}
.chips{display:flex;gap:22px;margin-top:10px;font-size:13px;color:var(--mut)}
.chips b{font-weight:400;color:var(--fg);font-size:18px;margin-left:6px;display:inline-block;min-width:44px}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:2px}
.mods{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:14px;margin-top:14px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:4px;padding:14px 16px 12px}
.panel h2{font:italic 300 26px/1 "Cormorant Garamond",Georgia,serif;margin:0 0 12px}
.ini{font:400 1.5em/.8 "Cinzel Decorative","Cormorant Garamond",serif;font-style:normal;color:var(--t);margin-right:1px;vertical-align:-.05em}
.grid{display:grid;grid-template-columns:118px 1fr 60px;gap:4px 10px;align-items:center}
.grid label{color:var(--mut);font-size:14px}
.grid output{text-align:right;font-size:14px;font-variant-numeric:tabular-nums}
select{grid-column:2/4;width:100%;font:inherit;font-size:15px;background:var(--bg);color:var(--fg);border:1px solid var(--line2);border-radius:3px;padding:7px 8px;margin:2px 0}
input[type=range]{-webkit-appearance:none;appearance:none;background:transparent;height:30px;width:100%;margin:0;touch-action:manipulation}
input[type=range]::-webkit-slider-runnable-track{height:2px;background:var(--line2)}
input[type=range]::-moz-range-track{height:2px;background:var(--line2)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:15px;height:15px;border-radius:50%;background:var(--m);border:0;margin-top:-6.5px}
input[type=range]::-moz-range-thumb{width:15px;height:15px;border-radius:50%;background:var(--m);border:0}
#env{grid-column:1/4;width:100%;height:74px;margin-top:8px;border-top:1px solid var(--line)}
#mbtn{grid-column:1/4;font:inherit;background:var(--bg);color:var(--t);border:1px solid var(--line2);border-radius:3px;padding:8px;cursor:pointer;margin-bottom:4px}
#mmsg{grid-column:1/4;margin:2px 0 4px;font-size:13.5px;color:var(--mut)}
.sub .lat{display:block;margin-top:4px;font-size:13px;opacity:.7}
.ded{margin-top:36px;text-align:center;font:400 13px/1 Alegreya,Georgia,serif;letter-spacing:.2em;text-transform:uppercase;color:var(--mut)}
#rst{display:block;margin:14px auto 0;background:none;border:0;color:var(--mut);opacity:.6;font:inherit;font-size:11px;letter-spacing:.2em;text-transform:uppercase;cursor:pointer}
.cvx{grid-column:1/-1;width:100%;display:block;border:1px solid var(--line);border-radius:3px;background:#090a0e;touch-action:none;margin:2px 0}
#scp{touch-action:auto}
#cvd{display:block;width:100%;height:60px}
.legend{display:flex;flex-wrap:wrap;justify-content:center;gap:6px 22px;margin-top:30px;font-size:13.5px;color:var(--mut)}
.legend b{font-weight:500;color:var(--fg);margin-right:6px}
.chips{flex-wrap:wrap;align-items:center}
.tools{margin-left:auto;display:flex;gap:8px}
.mini{font:inherit;font-size:12.5px;background:none;border:1px solid var(--line2);color:var(--mut);border-radius:3px;padding:3px 10px;cursor:pointer;letter-spacing:.06em}
.mini:hover{color:var(--fg);border-color:var(--t)}
.grid:empty{display:none}
details{border-top:1px solid var(--line);padding:2px 0}
summary{cursor:pointer;font:italic 300 19px "Cormorant Garamond",Georgia,serif;padding:6px 0;list-style:none}
summary::-webkit-details-marker{display:none}
summary::before{content:"+";display:inline-block;width:18px;color:var(--t)}
details[open]>summary::before{content:"\2013"}
details .grid{padding:2px 0 10px}
@media(max-width:480px){h1{font-size:26px;letter-spacing:.1em}h1 span{display:block;margin:6px 0 0}#cv{height:210px}.grid{grid-template-columns:100px 1fr 54px}}
</style>
</head>
<body>
<main>
<header>
  <div><h1>CAMPANULA <span>a Tintinnabuli Sequencer</span></h1><p class="by">Giacomo Falciani</p><p class="sub">Mis liigub ja mis jääb<span class="lat">Quod movetur et quod manet</span></p></div>
  <button id="go" aria-label="Play"></button>
</header>
<div class="roll"><canvas id="cv"></canvas></div>
<div class="roll" style="margin-top:6px"><canvas id="cvd"></canvas></div>
<div class="chips">
  <span><i class="dot" style="background:var(--m)"></i>M-Voice<b id="cm">–</b></span>
  <span><i class="dot" style="background:var(--t)"></i>T-Voice<b id="ct">–</b></span>
  <span class="tools"><button class="mini" id="rst2">Restart</button><button class="mini" id="exp">Export MIDI</button></span>
</div>
<div class="mods" id="mods"></div>
<div class="legend"><span><i class="dot" style="background:var(--m)"></i><b>M-Voice</b>Melodia, the walking voice</span><span><i class="dot" style="background:var(--t)"></i><b>T-Voice</b>Tintinnabuli, the bells of the triad</span><span><i class="dot" style="background:#7fb3a6"></i><b>Drone</b>the held ground</span></div>
<footer class="ded">Für Arvo<button id="rst">Reset settings</button></footer>
</main>
<script>
const $=id=>document.getElementById(id);
const NAMES=["C","C#","D","D#","E","F","F#","G","G#","A","A#","B"];
const SCALES={
 "Natural minor":[0,200,300,500,700,800,1000],
 "Major":[0,200,400,500,700,900,1100],
 "Hirajoshi":[0,200,300,700,800],
 "In (Miyako-bushi)":[0,100,500,700,800],
 "Insen":[0,100,500,700,1000],
 "Iwato":[0,100,500,600,1000],
 "Yo":[0,200,500,700,900],
 "Ryukyu":[0,400,500,700,1100],
 "Kumoi":[0,200,300,700,900],
 "Micro: neutral 24-TET":[0,200,350,500,700,850,1050],
 "Micro: just minor":[0,203.9,315.6,498,702,813.7,1017.6],
 "Micro: slendro (5 equal)":[0,240,480,720,960],
 "Micro: 7 equal":[0,171.4,342.9,514.3,685.7,857.1,1028.6]};
const INST={bell:"Bell",piano:"Piano",koto:"Koto",cello:"Cello",violin:"Violin",fm:"FM sine 8-bit",pad:"Ambient pad",add:"Additive / FM"};
const GAIN={bell:1,piano:1,koto:.9,cello:.6,violin:.5,fm:.5,pad:.5,add:.8};
const PRE={bell:["ad",20,92,0,60],piano:["ad",15,80,0,50],koto:["ad",5,62,0,40],fm:["adsr",10,50,60,50],
 cello:["adsr",65,50,80,65],violin:["adsr",58,45,85,60],pad:["adsr",85,70,75,85],add:["adsr",15,55,70,55]};
const EM={A:p=>.005*Math.pow(1200,p/100),D:p=>.05*Math.pow(200,p/100),S:p=>p/100,R:p=>.05*Math.pow(160,p/100)};
const sec=x=>x<1?Math.round(x*1000)+" ms":x.toFixed(1)+" s";
const MAPS={},FMT={},MC="#8fa6e0",TC="#d99a64";
let cur;
function panel(title){const s=document.createElement("section"),h=document.createElement("h2"),g=document.createElement("div");
 s.className="panel";h.innerHTML='<span class="ini">'+title[0]+'</span>'+title.slice(1);g.className="grid";s.append(h,g);$("mods").appendChild(s);cur=g}
function sel(id,label,opts,def,cb){const l=document.createElement("label");l.htmlFor=id;l.textContent=label;
 const s=document.createElement("select");s.id=id;for(const k in opts){const o=document.createElement("option");o.value=k;o.textContent=opts[k];s.appendChild(o)}
 s.value=def;if(cb)s.addEventListener("change",cb);cur.append(l,s)}
function sld(id,label,min,max,val,map,fmt,cb){const l=document.createElement("label");l.htmlFor=id;l.textContent=label;
 const i=document.createElement("input");i.type="range";i.id=id;i.min=min;i.max=max;i.value=val;
 const o=document.createElement("output");o.id=id+"_o";MAPS[id]=map;FMT[id]=fmt;
 i.addEventListener("input",()=>{upd(id);if(cb)cb()});cur.append(l,i,o);upd(id)}
const get=id=>MAPS[id](+$(id).value);
function upd(id){$(id+"_o").textContent=FMT[id](get(id))}
const idn=v=>v,pc=v=>v+"%";
const sc={};Object.keys(SCALES).forEach(k=>sc[k]=k);
const keys={};NAMES.forEach((n,i)=>keys[i]=n);

const TRIS={triad:[0,2,4],power:[0,4],root:[0],seventh:[0,2,4,6]};
const OCT={"-2":"-2 oct","-1":"-1 oct","0":"0","1":"+1 oct","2":"+2 oct"};
function getScale(){const b=SCALES[$("scale").value],r=Math.min(+$("rot").value,b.length-1);if(!r)return b;const o=b[r];return b.slice(r).map(c=>c-o).concat(b.slice(0,r).map(c=>c-o+1200))}
let drn=[],drc=null;const DR=[],DC="#7fb3a6",NB={};
function nbuf(k){if(NB[k])return NB[k];const n=ctx.sampleRate*3,b=ctx.createBuffer(1,n,ctx.sampleRate),d=b.getChannelData(0);
 if(k==="white")for(let i=0;i<n;i++)d[i]=Math.random()*2-1;
 else{let b0=0,b1=0,b2=0,b3=0,b4=0,b5=0,b6=0;for(let i=0;i<n;i++){const w=Math.random()*2-1;b0=.99886*b0+w*.0555179;b1=.99332*b1+w*.0750759;b2=.969*b2+w*.153852;b3=.8665*b3+w*.3104856;b4=.55*b4+w*.5329522;b5=-.7616*b5-w*.016898;d[i]=(b0+b1+b2+b3+b4+b5+b6+w*.5362)*.11;b6=w*.115926}}
 return NB[k]=b}
function dstop(){if(MOD.sum)["dlev","dpit","dflt"].forEach(k=>MOD.sum[k].disconnect());if(drc){drc.t1=ctx?ctx.currentTime:0;drc=null}
 if(drn.g&&ctx){const R=envv("d").R,T=ctx.currentTime;drn.g.gain.setTargetAtTime(0,T,R/3);drn.forEach(o=>{try{o.stop(T+R+.6)}catch(e){}})}drn=[]}
function breath(f,g){const s=ctx.createBufferSource();s.buffer=nbuf("white");s.loop=true;
 [1,2].forEach(k=>{const bp=ctx.createBiquadFilter(),x=ctx.createGain();bp.type="bandpass";bp.frequency.value=f*k;bp.Q.value=40;x.gain.value=8/k;s.connect(bp);bp.connect(x);x.connect(g)});
 s.start();drn.push(s)}
function drone(){dstop();if(!ctx||!running||$("don").value==="off")return;
 const S=getScale(),key=+$("key").value,oc=+$("dact").value,T=ctx.currentTime,tm=$("dtim").value,E=envv("d"),
  dg=({root:[0],fifth:[0,4],third:[0,2],triad:[0,2,4],seven:[0,6],seventh:[0,2,4,6]})[$("drn").value]||[0],
  f0=130.81*Math.pow(2,key/12+oc),fs=dg.map(d=>f0*Math.pow(2,cents(d,S)/1200)),g=ctx.createGain(),lvl=get("drl")/100*.12;
 g.gain.setValueAtTime(0,T);g.gain.linearRampToValueAtTime(lvl,T+Math.max(E.A,.05));const dfl=ctx.createBiquadFilter();dfl.type="lowpass";dfl.frequency.value=get("dcut");g.connect(dfl);dfl.connect(ctx.bus);drn.f=dfl;if(MOD.sum){MOD.sum.dlev.connect(g.gain);MOD.sum.dflt.connect(dfl.detune)}
 const add=(ty,fr,a,det=0,flt)=>{const o=ctx.createOscillator(),x=ctx.createGain();o.type=ty;o.frequency.value=fr;o.detune.value=det;if(MOD.sum)MOD.sum.dpit.connect(o.detune);x.gain.value=a;o.connect(x);
  if(flt){const b=ctx.createBiquadFilter();b.type="lowpass";b.frequency.value=flt;x.connect(b);b.connect(g)}else x.connect(g);o.start();drn.push(o)};
 const pwm=(fr,flt,a)=>{const o=ctx.createOscillator(),d=ctx.createDelay(.1),inv=ctx.createGain(),sum=ctx.createGain(),l=ctx.createOscillator(),lg=ctx.createGain(),b=ctx.createBiquadFilter();
  o.type="sawtooth";o.frequency.value=fr;if(MOD.sum)MOD.sum.dpit.connect(o.detune);d.delayTime.value=.5/fr;inv.gain.value=-1;sum.gain.value=a;l.frequency.value=.25;lg.gain.value=.35/fr;l.connect(lg);lg.connect(d.delayTime);
  o.connect(sum);o.connect(d);d.connect(inv);inv.connect(sum);b.type="lowpass";b.frequency.value=flt;sum.connect(b);b.connect(g);o.start();l.start();drn.push(o,l)};
 const ns=(k,a)=>{const s2=ctx.createBufferSource(),x=ctx.createGain();s2.buffer=nbuf(k);s2.loop=true;x.gain.value=a;s2.connect(x);x.connect(g);s2.start();drn.push(s2)};
 if(tm==="white")ns("white",.3);else if(tm==="pink")ns("pink",.8);
 else fs.forEach(f=>{
  if(tm==="sub"){add("sine",f,1);add("sawtooth",f/2,.5,0,450)}
  else if(tm==="subsq"){add("sine",f,1);pwm(f/2,700,.4)}
  else if(tm==="pad"){(lite()?[-7,7]:[-9,0,9]).forEach(d=>add("sawtooth",f,.3,d,900))}
  else if(tm==="square"){add("square",f,.45,0,700);add("sine",f/2,.5)}
  else if(tm==="organ"){[1,2,3,4,6].forEach((k,i)=>add("sine",f*k,.8/(i+1)))}
  else if(tm==="bowl"){[[1,1],[2.76,.35],[5.4,.15]].forEach(([k,a])=>{add("sine",f*k,a,-3);add("sine",f*k,a,3)})}
  else if(tm==="breath"){breath(f,g)}
  else if(tm==="ice"){const c=ctx.createOscillator(),m=ctx.createOscillator(),mg=ctx.createGain(),l=ctx.createOscillator(),lg=ctx.createGain(),x=ctx.createGain();
   c.frequency.value=f;m.frequency.value=f*1.4142;mg.gain.value=f*2;l.frequency.value=.07;lg.gain.value=f*1.6;l.connect(lg);lg.connect(mg.gain);m.connect(mg);mg.connect(c.frequency);
   x.gain.value=.8;c.connect(x);x.connect(g);[c,m,l].forEach(o=>{o.start();drn.push(o)})}
  else if(tm==="fog"){[-17,-9,-4,0,5,11,19].forEach(d=>add("sine",f,.22,d))}
  else{add("sine",f,1);add("triangle",f*2.003,.25)}});
 drn.g=g;drc={t0:T,t1:null,notes:dg.map(d=>key+cents(d,S)/100-12+12*oc)};DR.push(drc);while(DR.length>40)DR.shift()}
function drawDrone(){const g=cd.getContext("2d"),W=cd.width,H=cd.height;if(!W)return;g.clearRect(0,0,W,H);
 const d=W/cd.clientWidth||1,lab=50*d,px=W*.8,now=ctx?ctx.currentTime:0,step=60/get("bpm")*+$("div").value,win=Math.min(24,Math.max(3,step*8)),pps=(px-lab)/win;
 g.font=(11*d)+"px Alegreya,Georgia,serif";g.textBaseline="middle";g.fillStyle="rgba(140,144,165,.75)";g.fillText("Drone",8*d,H/2);
 g.strokeStyle="rgba(217,154,100,.4)";g.lineWidth=d;g.beginPath();g.moveTo(px,0);g.lineTo(px,H);g.stroke();
 g.save();g.beginPath();g.rect(lab,0,W-lab,H);g.clip();g.fillStyle=DC;
 for(const e of DR){const x0=Math.max(px-(now-e.t0)*pps,lab),x1=e.t1==null?px:px-(now-e.t1)*pps;if(x1<lab||x0>W)continue;
  const n=e.notes.length,lh=Math.min(10*d,(H-10*d)/n-2*d);
  e.notes.forEach((s2,i)=>{const y=H/2-(i-(n-1)/2)*(lh+2*d);g.globalAlpha=.85;g.fillRect(x0,y-lh/2,Math.max(x1-x0,2*d),lh);
   if(e.t1==null&&x1-x0>40*d){g.globalAlpha=.9;g.fillStyle="#c8cad6";g.fillText(nn(s2),x0+4*d,y);g.fillStyle=DC}})}
 g.restore();g.globalAlpha=1}
const IOS=/iPhone|iPad|iPod/i.test(navigator.userAgent)||(navigator.platform==="MacIntel"&&navigator.maxTouchPoints>1);
const LOW=!IOS&&/Android/i.test(navigator.userAgent)&&(navigator.deviceMemory||4)<=4;
const lite=()=>$("perf").value==="lite"||($("perf").value==="auto"&&LOW);
function subp(t,open){const sec=cur.closest(".panel"),d=document.createElement("details"),m=document.createElement("summary"),g=document.createElement("div");d.open=!!open;m.textContent=t;g.className="grid";d.append(m,g);sec.appendChild(d);cur=g}
panel("Master");
sld("vol","Volume",0,100,60,v=>v/100*1.8,v=>Math.round(v/1.8*100)+"%",()=>{if(master)master.gain.setTargetAtTime(get("vol"),ctx.currentTime,.05)});
sel("perf","Performance",{auto:"Auto (Lite only on weaker Android)",std:"Standard",lite:"Lite (weaker phones)"},"auto");
subp("Mixer",true);
sld("lm","M-Voice",0,100,100,idn,pc);
sld("lt","T-Voice",0,100,100,idn,pc);
sld("drl","Drone level",0,100,40,idn,pc,()=>{if(drn.g&&ctx)drn.g.gain.setTargetAtTime(get("drl")/100*.12,ctx.currentTime,.1);if(ctx&&MOD.sum)applyMod()});
sel("don","Drone on/off",{off:"Off",on:"On"},"off",()=>drone());
panel("Harmony");
sel("scale","Scale",sc,"Natural minor",()=>drone());
sel("rot","Mode",{0:"Start on degree 1",1:"Start on degree 2",2:"Start on degree 3",3:"Start on degree 4",4:"Start on degree 5",5:"Start on degree 6",6:"Start on degree 7"},0);
sel("key","Key",keys,9,()=>drone());
sel("tpos","T-Voice",{below:"Triad note below",above:"Triad note above",alt:"Alternating"},"below");
sel("chord","T-Voice notes",{triad:"Triad (1-3-5)",power:"Root + fifth",root:"Root only",seventh:"Seventh chord"},"triad");
sel("moct","M-Voice octave",OCT,0);
sel("toct","T-Voice octave",OCT,0);
sel("drn","Drone notes",{root:"Root only",fifth:"I \u2013 V",third:"I \u2013 III",triad:"I \u2013 III \u2013 V",seven:"I \u2013 VII",seventh:"I \u2013 III \u2013 V \u2013 VII"},"root",()=>drone());
sel("dact","Drone octave",OCT,0,()=>drone());
sld("dcut","Drone cutoff",0,100,100,v=>30*Math.pow(600,v/100),v=>v>=1000?(v/1000).toFixed(1)+" kHz":Math.round(v)+" Hz",()=>{if(drn.f&&ctx)drn.f.frequency.setTargetAtTime(get("dcut"),ctx.currentTime,.1)});
sel("dtim","Drone timbre",{def:"Default (sine + triangle)",sub:"Sub-oscillator (saw)",subsq:"Sub-oscillator (square, PWM)",pad:"Warm pad",square:"Hollow square",organ:"Organ",bowl:"Singing bowl",breath:"Breath",white:"White noise",pink:"Pink noise",ice:"Ice (FM, evolving)",fog:"Fog (detuned cluster)"},"def",()=>drone());
panel("Time");
sld("bpm","Tempo",20,240,44,idn,v=>v+" bpm",()=>{if(ctx&&MOD.sum)applyMod()});
sel("div","Step",{2:"2 beats",1:"1 beat",.5:"1/2 beat",.25:"1/4 beat",.125:"1/8 beat"},2);
sld("ma","Probability",20,100,75,idn,pc);
sld("rng","Range",3,12,6,idn,v=>v+" steps");
sld("turn","Direction change",0,50,12,idn,pc);
sld("rtg","Retrig",0,60,0,idn,pc);
sld("rat","Ratchet",1,8,2,idn,v=>v+"×");
sld("rch","Ratchet chance",0,100,0,idn,pc);
sld("hum","Humanize",0,100,0,idn,pc);
panel("Process");
sel("pon","Process",{off:"Off (standard sequencer)",on:"On"},"off");
sel("pwhen","Applies",{always:"Always",alt2:"Every 2nd phrase",alt4:"Every 4th phrase",rand:"Random phrases (50%)"},"always");
sld("plen","Phrase length",4,64,16,idn,v=>v+" steps");
subp("Grow / shrink",false);
sel("add_on","Process",{off:"Off",on:"On"},"off",()=>addReset());
sel("add_mode","Mode",{grow:"Grow",shrink:"Shrink",both:"Grow, then shrink"},"grow",()=>addReset());
sld("add_min","Shortest cell",1,16,2,idn,v=>v+" steps");
sld("add_max","Longest cell",2,32,8,idn,v=>v+" steps");
